[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "orbit-sql-mysql"
version = "0.1.0a1"
description = "Async MySQL provider adapter and Core lifecycle plugin for Orbit SQL."
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
  "orbit-core>=0.1.0a1,<0.2",
  "orbit-sql>=0.1.0a1,<0.2",
  "asyncmy>=0.2.11,<0.3",
  "pydantic>=2.8,<3",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
  "Typing :: Typed",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.8,<1", "mypy>=1.13,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/orbit_sql_mysql"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["orbit_sql_mysql"]
